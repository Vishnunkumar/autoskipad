    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in iframe/Cloud Run environment
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('ws://') !== -1 || e.message.indexOf('wss://') !== -1)) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      }, true);
    </script>
